<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>HASTUS Schedule Decoder</title>

	<style>
		:root {
			font-family: system-ui, sans-serif;
			font-weight: normal;
			color-scheme: light dark;
		}

		:root {
			--accent: rgb(255, 199, 44);
		}

		@media (prefers-color-scheme: dark) {
			:root {
				--accent: oklch(34.57% 0.1655 86.55);
			}
		}

		.alternate-t-body {
			/* Using multiple `tbody`'s due to usage of rowspan */
			tbody:nth-child(odd) {
				background-color: var(--accent);
			}
		}

		.display {
			display: flex;
			flex-flow: row wrap;
			align-items: flex-start;

			details:not([open]) {
				flex-basis: 100%;
			}

			.current-data, dl {
				flex: 0 0 auto;
			}

			.table-data, table {
				flex: 1 0 auto;
			}
		}

		.table-data {
			table {
				overflow-x: auto;
				width: 100%;
			}
		}
	</style>
</head>

<body>
	<form target="_self" method="get">
		<label for="schedule-id">Schedule ID</label>
		<input type="text" name="schedule-id" id="schedule-id" autocomplete="schedule-id">

		<input type="text" name="schedule-id-list" id="schedule-id-list" hidden="hidden">

		<input type="submit" hidden />
	</form>


	<div class="display">
		<details open class="current-data">
			<summary>Current Item Details</summary>
			<dl>
				<dt>Schedule Type</dt>
				<dd>
					<output id="out-schedule-type">N/A</output>
				</dd>
				<dt>Schedule Mode</dt>
				<dd>
					<output id="out-schedule-mode">N/A</output>
				</dd>
				<dt>Garage</dt>
				<dt>Yard</dt>
				<dd>
					<output id="out-schedule-garage">N/A</output>
				</dd>
				<dt>Rating Quarter</dt>
				<dd>
					<output id="out-schedule-rating-quarter">N/A</output>
				</dd>
				<dt>Last digit of year</dt>
				<dd>
					<output id="out-schedule-year-digit">N/A</output>
				</dd>
				<dt>Description Code</dt>
				<dd>
					<output id="out-schedule-description-code">N/A</output>
				</dd>
				<dt>Service Type</dt>
				<dd>
					<output id="out-service-type">N/A</output>
				</dd>
			</dl>
		</details>

		<details open class="table-data">
			<summary></summary>
			<table id="table-output" class="alternate-t-body">
				<thead>
					<tr>
						<th>Input Value</th>
						<th>Schedule Type</th>
						<th>Schedule Mode</th>
						<th>Garage or Yard</th>
						<th>Rating Quarter</th>
						<th>Last Digit of Year</th>
						<th>Description Code</th>
						<th>Service Type</th>
					</tr>
				</thead>
			</table>
		</details>
	</div>
</body>

<!--
Template for `#table-output` "rows"

The template uses `data-field-id` attributes to identify the nodes where data
should be inserted.

This uses `data-` attributes instead of say the `id` attribute so that the HTML
contract that `id`'s are unique is not broken accidentally.
-->
<template id="template::output-row">
	<tbody>
		<tr>
			<th rowspan="2" scope="rowgroup"><code data-field-id="field-value"></code></th>

			<td><code data-field-id="field-type"></code></td>
			<td><code data-field-id="field-mode"></code></td>
			<td><code data-field-id="field-garage"></code></td>
			<td><code data-field-id="field-rating-quarter"></code></td>
			<td><code data-field-id="field-year-digit"></code></td>
			<td><code data-field-id="field-description-code"></code></td>
			<td><code data-field-id="field-service-type"></code></td>
		</tr>
		<tr>
			<td data-field-id="mapped-type"></td>
			<td data-field-id="mapped-mode"></td>
			<td data-field-id="mapped-garage"></td>
			<td data-field-id="mapped-rating-quarter"></td>
			<td data-field-id="mapped-year-digit"></td>
			<td data-field-id="mapped-description-code"></td>
			<td data-field-id="mapped-service-type"></td>
		</tr>
	</tbody>
</template>

<script>
const unknown = undefined

/** Definition List UI Element references */
const scheduleElements = /** @type {const} */ ({
	type:
		/** @type {HTMLOutputElement} */ (document.getElementById("out-schedule-type")),
	mode:
		/** @type {HTMLOutputElement} */ (document.getElementById("out-schedule-mode")),
	garage:
		/** @type {HTMLOutputElement} */ (document.getElementById("out-schedule-garage")),
	rating_quarter:
		/** @type {HTMLOutputElement} */ (document.getElementById("out-schedule-rating-quarter")),
	year_digit:
		/** @type {HTMLOutputElement} */ (document.getElementById("out-schedule-year-digit")),
	description_code:
		/** @type {HTMLOutputElement} */ (document.getElementById("out-schedule-description-code")),
	service_type:
		/** @type {HTMLOutputElement} */ (document.getElementById("out-service-type")),
})

/** Table UI Element reference */
const tableOutput = document.getElementById("table-output")

/** URL Params for Saved Searches */
const urlParams = new URLSearchParams(window.location.search)

/** Parsing previously added schedule ids on initial load */
const previousInputs = /** @type {HTMLInputElement} */ (document.getElementById("schedule-id-list"))
try {
	// Ensure valid json
	const parsedJson = JSON.parse(urlParams.get("schedule-id-list"))
	previousInputs.value = JSON.stringify(parsedJson && Array.isArray(parsedJson) && parsedJson || [])
} catch (error) {
	previousInputs.value = JSON.stringify([])
}
for (const value of JSON.parse(previousInputs.value)) {
	const fieldValues = parseHastusScheduleId(value)
	if (!fieldValues) { continue }
	const mappedValues = scheduleValuesFromString(fieldValues)

	const tableRow = createTableElementFromTemplate(fieldValues, mappedValues)
	tableRow && tableOutput.append(tableRow)
}

/** Schedule ID Input Element reference */
const inputElement = /** @type {HTMLInputElement} */ (document.getElementById("schedule-id"))

inputElement.value = urlParams.get(inputElement.id)
inputElement.addEventListener("input", (ev) => {
	/** @type {string} */
	const value = ev.target.value
	updateDisplay(value)
})

updateDisplay(inputElement.value)



//#region Functions
/**
 * Pulls out component parts of a HASTUS Schedule ID
 * @param {string} value
 */
function parseHastusScheduleId(value) {
	if (value.length < 8) { return undefined }
	value = value.slice(0, 8)

	const [
		type,
		mode,
		garage,
		rating_quarter,
		year_digit,
		description_code,
		service_type
	] = [
		value.slice(0, 1),
		value.slice(1, 2),
		value.slice(2, 3),
		value.slice(3, 4),
		value.slice(4, 5),
		value.slice(5, 7),
		value.slice(7, 8),
	]

	return /** @type {const} */ ({
		value,
		type,
		mode,
		garage,
		rating_quarter,
		year_digit,
		description_code,
		service_type
	})
}

//#region Update Functions
/**
 * Updates the DOM elements with a value parsed from {@linkcode value}
 * @param {string} value
 */
function updateDisplay(value) {
	const fieldValues = parseHastusScheduleId(value)
	if (!fieldValues) { return }
	const mappedValues = scheduleValuesFromString(fieldValues)

	updateDefinitionList(mappedValues)

	const tableRow = createTableElementFromTemplate(fieldValues, mappedValues)
	if (tableRow) {
		tableOutput.append(tableRow)
		previousInputs.value = appendScheduleValue(previousInputs.value, value)
	}
}

/**
 * @param {string} acc
 * @param {string} value
 * @returns {string}
 */
function appendScheduleValue(acc, value) {
	const maybe_arr = JSON.parse(acc)
	// Check that it's an array, but the values should be "reasonable"
	/** @type {any[]} */
	const valuesArray = (maybe_arr && Array.isArray(maybe_arr) && maybe_arr) || []

	valuesArray.push(value)
	return JSON.stringify(valuesArray)
}

/** @param {MappedScheduleIdValues} mappedValues */
function updateDefinitionList(mappedValues) {
	scheduleElements.type.value = mappedValues.type
	scheduleElements.mode.value = mappedValues.mode
	scheduleElements.garage.value = mappedValues.garage
	scheduleElements.rating_quarter.value = mappedValues.rating_quarter
	scheduleElements.year_digit.value = mappedValues.year_digit
	scheduleElements.description_code.value = mappedValues.description_code
	scheduleElements.service_type.value = mappedValues.service_type
}

/**
 * @param {ScheduleIdFields} fieldValues
 * @param {MappedScheduleIdValues} mappedValues
 */
function createTableElementFromTemplate(fieldValues, mappedValues) {
	const template =  document.getElementById("template::output-row")
	if (!(template instanceof HTMLTemplateElement)) { return }

	const row = template.content.cloneNode(true)
	if (!(row instanceof DocumentFragment)) { return }

	for(const element of row.querySelectorAll("[data-field-id]")) {
		if(!(element instanceof HTMLElement)) { continue }

		const fieldId = element.dataset.fieldId
		if(fieldId === undefined) { continue }

		const value = getValueForFieldId(fieldId, fieldValues, mappedValues)
		if(value === unknown) { continue }

		element.textContent = value.toString()
	}

	return row
}

/**
 * @param {string} fieldId
 * @param {ScheduleIdFields} fieldValues
 * @param {MappedScheduleIdValues} mappedValues
 */
function getValueForFieldId(fieldId, fieldValues, mappedValues) {
	switch(fieldId) {
		case "field-value":
			{ return fieldValues.value }
		case "field-type":
			{ return fieldValues.type }
		case "field-mode":
			{ return fieldValues.mode }
		case "field-garage":
			{ return fieldValues.garage }
		case "field-rating-quarter":
			{ return fieldValues.rating_quarter }
		case "field-year-digit":
			{ return fieldValues.year_digit }
		case "field-description-code":
			{ return fieldValues.description_code }
		case "field-service-type":
			{ return fieldValues.service_type }

		case "mapped-type":
			{ return mappedValues.type }
		case "mapped-mode":
			{ return mappedValues.mode }
		case "mapped-garage":
			{ return mappedValues.garage }
		case "mapped-rating-quarter":
			{ return mappedValues.rating_quarter }
		case "mapped-year-digit":
			{ return mappedValues.year_digit }
		case "mapped-description-code":
			{ return mappedValues.description_code }
		case "mapped-service-type":
			{ return mappedValues.service_type }
	}

	return unknown
}
//#endregion Update Functions

//#region Lookup Functions
// Functions related to mapping a HASTUS short "code" or value to a longer more
// meaningful value

/**
 * @typedef {NonNullable<ReturnType<typeof parseHastusScheduleId>>} ScheduleIdFields
 * @typedef {ReturnType<typeof scheduleValuesFromString>} MappedScheduleIdValues
 */

/** @param {ScheduleIdFields} */
function scheduleValuesFromString({
	type,
	mode,
	garage,
	rating_quarter,
	year_digit,
	description_code,
	service_type
}) {
	return /** @type {const} */ ({
		type: lookupScheduleType(type) ?? "Unknown",
		mode: modeFromString(mode) ?? "Unknown",
		garage: garageFromString(garage) ?? "Unknown",
		rating_quarter: ratingQuarterFromString(rating_quarter),
		year_digit: yearDigitFromString(year_digit),
		description_code: descriptionCodeFromString(description_code) ?? "Unknown",
		service_type: serviceTypeFromString(service_type) ?? "Unknown",
	})
}

/** @param {string} v */
function lookupScheduleType(v) {
	switch (v) {
		case "a": return "Crew"
		case "h": return "Vehicle"
		default: return unknown
	}
}

/** @param {string} v */
function modeFromString(v) {
	switch (v) {
		case "b": return "Bus"
		case "p": return "Contractor Operated Bus"
		case "m": return "Heavy Rail Subway"
		case "l": return "Light Rail Subway"
		default: return unknown
	}
}
/** @param {string} v */
function garageFromString(v) {
	switch (v) {
		default: return unknown
	}
}

/** @param {string} v */
function ratingQuarterFromString(v) {
	switch (v) {
		case "1": return "Winter"
		case "2": return "Spring"
		case "3": return "Summer"
		case "4": return "Fall"
		default: return unknown
	}
}

/** @param {string} v */
function yearDigitFromString(v) {
	const year = new Date().getFullYear()
	return (year - (year % 10) + parseInt(v)) || unknown
}

/** @param {string} v */
function descriptionCodeFromString(v) {
	switch (v) {
		// Typical Service
		case "01":
		case "02":
		case "bk":
		case "cl":
		case "fr":
		case "gx":
		case "rd":
		case "sa":
		case "sw":
		case "wk":
			return "Normal Schedule"

		case "ns":
		case "nf":
		case "nx":
		case "nz":
		case "sn":
		case "pn":
		case "sf":
		case "nt":
			return "No School"

		case "hl":
		case "j4":
		case "th":
		case "tp":
		case "xm":
		case "me":
		case "ch":
		case "pt":
		case "pd":
		case "ny":
		case "sp":
			// Typicality: Holiday
			return "Holiday"

		// Weather Based Service
		case "we":
		case "wt":
		case "l4":
		case "a4":
		case "b4":
		case "f4":
		case "h4":
		case "w4":
		case "hp":
		case "tn":
		case "ts":
			// Typicality: Weather
			return "Reduced Service"

		case "l3":
		case "a3":
		case "b3":
		case "f3":
		case "w3":
		case "co":
			// Typicality: Weather
			return /** AND schedule_type == "1" */ "Reduced Service"

		case "al":
			// Typicality: Weather
			return "Alternate Service"

		case "wn":
			// Typicality: Weather
			return "Weekday Schedule (Reduced Service, No School)"


		// Extra Service
		case "fn":
			// Typicality: Extra
			return "New Year's Eve"


		// Disruptions
		case "3l":
		case "ut":
			// Typicality: Planned Disruption
			return "Sumner Tunnel Closure"

		default:
			// Typicality: Planned Disruption|Fallback
			return "Modified Service (or Unknown)"
	}
}

/** @param {string} v */
function serviceTypeFromString(v) {
	switch (v) {
		case "1": return "Weekdays"
		case "6": return "Saturdays"
		case "7": return "Sundays"
		default: return unknown
	}
}
//#endregion Lookup Functions
//#endregion Functions
</script>
</html>
